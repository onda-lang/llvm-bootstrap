name: Build LLVM Releases

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LLVM_LINKAGE: Static
  LLVM_WINDOWS_MSVC_RUNTIME: MT
  LLVM_MACOS_DEPLOYMENT_TARGET: "11.0"

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish archives to a GitHub release"
        required: true
        default: true
        type: boolean
  push:
    tags:
      - "llvm-*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      LLVM_BUILD_CONTAINER: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-2022
            container: ''
            platform: windows
            arch: x64
          - name: linux-x64 (Debian 12)
            runner: ubuntu-24.04
            container: debian:bookworm@sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8
            platform: linux
            arch: x64
          - name: linux-arm64 (Debian 12)
            runner: ubuntu-24.04-arm
            container: debian:bookworm@sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8
            platform: linux
            arch: arm64
          - name: macos-arm64
            runner: macos-latest
            container: ''
            platform: macos
            arch: arm64

    steps:
      - name: Install Debian build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          source /etc/os-release
          test "$ID:$VERSION_ID" = debian:12
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.36'
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake git ninja-build python3 xz-utils

      - name: Checkout bootstrap repo
        uses: actions/checkout@v5

      - name: Test Linux package validation
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s tests -v

      - name: Read LLVM version
        id: version
        shell: bash
        run: |
          llvm_ref="$(tr -d '\r\n' < llvm.version)"
          if [[ -z "$llvm_ref" ]]; then
            echo "llvm.version is empty" >&2
            exit 1
          fi
          if [[ "$llvm_ref" == llvmorg-* ]]; then
            version="${llvm_ref#llvmorg-}"
          else
            version="$llvm_ref"
          fi
          release_tag="llvm-$version"
          {
            echo "llvm_ref=$llvm_ref"
            echo "version=$version"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout llvm-project
        uses: actions/checkout@v5
        with:
          repository: llvm/llvm-project
          ref: ${{ steps.version.outputs.llvm_ref }}
          path: llvm-project
          fetch-depth: 1

      - name: Build LLVM on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found at $vswhere"
          }

          $vsInstallPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstallPath) {
            throw "Visual Studio with MSVC tools not found"
          }

          $vsDevCmd = Join-Path $vsInstallPath "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $vsDevCmd)) {
            throw "VsDevCmd.bat not found at $vsDevCmd"
          }

          $captureEnvScript = Join-Path $env:RUNNER_TEMP "capture-msvc-env.cmd"
          @"
          @echo off
          call "$vsDevCmd" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b %errorlevel%
          set
          "@ | Set-Content -Path $captureEnvScript -Encoding ascii

          $msvcEnv = cmd.exe /d /c $captureEnvScript
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to initialize MSVC build environment via VsDevCmd.bat"
          }

          foreach ($line in $msvcEnv) {
            if ($line -match '^(.*?)=(.*)$') {
              [System.Environment]::SetEnvironmentVariable($matches[1], $matches[2])
            }
          }

          & .\build.ps1 `
            -LlvmRef "${{ steps.version.outputs.llvm_ref }}" `
            -SourceDir "$PWD/llvm-project" `
            -BuildDir "$PWD/build" `
            -InstallDir "$PWD/install" `
            -Linkage "${{ env.LLVM_LINKAGE }}" `
            -MsvcRuntime "${{ env.LLVM_WINDOWS_MSVC_RUNTIME }}"

      - name: Build LLVM on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x ./build.sh
          ./build.sh \
            "${{ steps.version.outputs.llvm_ref }}" \
            "$PWD/llvm-project" \
            "$PWD/build" \
            "$PWD/install" \
            "${{ env.LLVM_LINKAGE }}" \
            "${{ env.LLVM_MACOS_DEPLOYMENT_TARGET }}"

      - name: Package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./package.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -Platform "${{ matrix.platform }}" `
            -Architecture "${{ matrix.arch }}" `
            -InstallDir "$PWD/install" `
            -OutputDir "$PWD/artifacts" `
            -Linkage "${{ env.LLVM_LINKAGE }}" `
            -MsvcRuntime "${{ env.LLVM_WINDOWS_MSVC_RUNTIME }}" `
            -LlvmRef "${{ steps.version.outputs.llvm_ref }}"

      - name: Verify macOS deployment targets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(install/bin/* install/lib/*.a install/lib/*.dylib)
          bash tests/check_macos_deployment_target.sh \
            "$LLVM_MACOS_DEPLOYMENT_TARGET" "${artifacts[@]}"

      - name: Package on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x ./package.sh
          ./package.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ matrix.platform }}" \
            "${{ matrix.arch }}" \
            "$PWD/install" \
            "$PWD/artifacts" \
            "${{ env.LLVM_LINKAGE }}" \
            "${{ steps.version.outputs.llvm_ref }}"

      - name: Verify packaged Linux SDK
        if: runner.os == 'Linux'
        shell: bash
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          extracted="$(mktemp -d)"
          tar -xf "artifacts/llvm-$PACKAGE_VERSION-linux-$PACKAGE_ARCH-static.tar.xz" -C "$extracted"
          python3 tests/check_linux_package.py "$extracted" "$PACKAGE_ARCH"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: llvm-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/*

  release:
    name: Publish Release
    if: ${{ github.event_name == 'push' || inputs.publish_release }}
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout bootstrap repo
        uses: actions/checkout@v5

      - name: Read LLVM version
        id: version
        shell: bash
        run: |
          llvm_ref="$(tr -d '\r\n' < llvm.version)"
          if [[ "$llvm_ref" == llvmorg-* ]]; then
            version="${llvm_ref#llvmorg-}"
          else
            version="$llvm_ref"
          fi
          release_tag="llvm-$version"
          {
            echo "llvm_ref=$llvm_ref"
            echo "version=$version"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Validate pushed tag matches llvm.version
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          pushed_tag="${GITHUB_REF_NAME}"
          expected_tag="${{ steps.version.outputs.release_tag }}"
          if [[ "$pushed_tag" != "$expected_tag" ]]; then
            echo "pushed tag '$pushed_tag' does not match expected tag '$expected_tag' from llvm.version" >&2
            exit 1
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Generate checksums
        shell: bash
        run: |
          find dist -type f \( -name '*.tar.xz' -o -name '*.zip' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > dist/SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: LLVM ${{ steps.version.outputs.version }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            dist/**/*.tar.xz
            dist/**/*.zip
            dist/SHA256SUMS.txt
